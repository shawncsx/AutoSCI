[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosci"
version = "0.1.0"
description = "AutoSCI — a distributed research-agent pipeline that turns a corpus into master's-level research drafts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AutoSCI Authors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autosci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
