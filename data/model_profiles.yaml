# ── Per-agent routing ──────────────────────────────────────────────────
# Maps each AutoSCI sub-agent to a tier. The tier then maps to a profile
# above. Default tier is "smart" if no entry.
routing:
  idea_closer:       smart
  lit_surveyer:      fast
  method_designer:    smart
  exp_designer:       smart
  paper_writer:       smart
  citation_grounder:  fast
  section_validator:  fast
  code_sketcher:      fast
  reviewer:           reason
  refuter:            reason
  idea_miner:         fast
  rerank:             fast
