# AutoSCI — model profiles (v0.13)
#
# Each named profile is a complete LLM endpoint. The agent → tier → profile
# mapping is in the `routing` block below. Delete a profile to fall back to
# AGNES_* env vars; comment a profile with `#` to skip it.
#
# Tiers:
#   fast   - cheapest, used for mechanical agents (LitSurveyer, Grounder, Sketcher)
#   smart  - default, used for design + writing
#   reason - best available, used for Reviewer + Refuter
#
# After editing, run:
#   python -m autosci.model_registry            # list profiles
#   python -m pytest tests/ -q                  # validate (uses fake LLM)

profiles:

  agnes_fast:
    provider: openai             # agnes is OpenAI-compatible
    base_url: ${AGNES_BASE_URL}
    api_key_env: AGNES_API_KEY
    model: ${AGNES_MODEL}
    cost_per_1k_in: 0.002
    cost_per_1k_out: 0.006
    note: "Default Agnes model (cheap)"

  agnes_smart:
    provider: openai
    base_url: ${AGNES_BASE_URL}
    api_key_env: AGNES_API_KEY
    model: ${AGNES_MODEL}        # for now same; switch to a stronger Agnes tier
    cost_per_1k_in: 0.005
    cost_per_1k_out: 0.015
    note: "Smarter Agnes model"

